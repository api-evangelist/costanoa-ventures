aid: costanoa-ventures
name: Costanoa Ventures
description: >-
  Costanoa Ventures is an early-stage venture capital firm founded in June 2012
  and headquartered in Palo Alto, California, with an additional office in San
  Francisco. Costanoa invests primarily at the Seed and Series A stages, writing
  checks of roughly $1M to $10M and taking concentrated 10-15% ownership across
  about 35 companies per fund. The firm's thesis is to fill the "missing middle"
  of early-stage venture by providing unusually hands-on, operator-led support to
  founders building applied AI, AI and data infrastructure, cybersecurity,
  national security / defense tech, fintech, and enterprise software companies.
  Costanoa was founded by Greg Sands (an early Netscape product manager) and
  manages roughly $2.8B in assets. In September 2024 it closed an oversubscribed
  Fund V at $275M alongside Opportunity Fund III at $119M, doubling down on
  AI-enabled B2B technology. Portfolio companies include Alation, Cyberhaven,
  Quizlet, PayNearMe, Auterion, Vannevar Labs, Kepler Communications, and Muon
  Space.
